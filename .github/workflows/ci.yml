name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: 后端测试 + Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check:repo
      - run: npm run lint
      - run: npm test

  build:
    name: 前端测试 + 构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
        working-directory: client
      - run: npm run lint
        working-directory: client
      - run: npm test
        working-directory: client
      - run: npm run build
        working-directory: client

  pack:
    name: npm 打包校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm pack --dry-run
      - run: node -e "const p=require('./package.json');const f=p.files||[];if(!f.includes('client/dist')){console.error('files 缺少 client/dist');process.exit(1)}else{console.log('✓ client/dist 已包含在发布包中')}"
