name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 要发布的 Git 标签，必须与 package.json 版本一致
        required: true
        type: string

concurrency:
  group: npm-publish-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: 打包、上传 Release 附件并发布 npm
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: 安装支持 OIDC 的 npm CLI
        run: npm install --global npm@11.6.2
      - run: pnpm install --frozen-lockfile
      - name: 校验 Release 标签与包版本
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          test "$RELEASE_TAG" = "$PACKAGE_VERSION" || {
            echo "Release 标签 $RELEASE_TAG 与 package.json 版本 $PACKAGE_VERSION 不一致"
            exit 1
          }
          gh release view "$RELEASE_TAG" >/dev/null || {
            echo "GitHub Release $RELEASE_TAG 不存在"
            exit 1
          }
        env:
          GH_TOKEN: ${{ github.token }}
      - name: 检查发布内容
        run: pnpm run release:check
      - name: 生成 npm 包
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_FILE="$(npm pack --ignore-scripts --json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s)[0].filename))")"
          test -f "$PACKAGE_FILE"
          echo "file=${PACKAGE_FILE}" >> "$GITHUB_OUTPUT"
      - name: 上传与 npm 发布一致的 Release 附件
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_FILE: ${{ steps.pack.outputs.file }}
        run: gh release upload "$RELEASE_TAG" "$PACKAGE_FILE" --clobber
      - name: 使用 OIDC 发布同一个包文件到 npm
        env:
          PACKAGE_FILE: ${{ steps.pack.outputs.file }}
        run: npm publish "$PACKAGE_FILE" --access public --provenance --ignore-scripts
